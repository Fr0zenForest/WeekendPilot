[platformio]
src_dir = hal_esp32/src

[env:weekendpilot_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -std=gnu++17
    -I core
    -DCORE_DEBUG_LEVEL=3
; ESP32 Arduino framework injects -std=gnu++11 after build_flags, which would
; win and break the C++17 default-member-init aggregates in core/. Strip it so
; our -std=gnu++17 above takes effect.
build_unflags =
    -std=gnu++11
; src_dir is hal_esp32/src; pull in the shared core/ implementation so
; wp::Controller::update links (paths are relative to src_dir).
build_src_filter =
    +<*>
    +<../../core/>
monitor_speed = 420000
